<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigil Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Sigil Studio</h1>

<canvas id="sigilCanvas" width="500" height="500"></canvas>

<div class="controls">
    <input type="text" id="wordInput" placeholder="Enter a word" />
    <label for="colorPicker">Sigil color:</label>
    <input type="color" id="colorPicker" value="#000000" >

    <button id="generateBtn">Generate</button>
    <button id="randomBtn">Random</button>
    <button id="downloadBtn">Download PNG</button>
</div>
    <label>
        <input type="checkbox" id="removeDuplicates" checked > 
        Remove Duplicate Letters</label>

<br>
<label for="pointCount">Points:</label>
<select id="pointCount">
    <option value="12" selected>12</option>
    <option value="16">16</option>
    <option value="24">34</option>
</select>


<script src="script.js"></script>

</body>
</html>
