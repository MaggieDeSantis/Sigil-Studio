<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigil Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Sigil Studio</h1>
<div class="layout">
    <div class="controls">
        <label for="wordInput">Word or Intention:<br></label>
        <input type="text" id="wordInput" placeholder="Enter a word" /><br><br>
        <label for="colorPicker">Sigil color:</label>
        <input type="color" id="colorPicker" value="#000000" >
    <br>
    <label>
        <input type="checkbox" id="removeDuplicates" checked > 
        Remove Duplicate Letters</label><br>

        <label for="pointCount">Points:</label>
        <select id="pointCount">
            <option value="12" selected>12</option>
            <option value="16">16</option>
            <option value="24">34</option>
        </select><br>
        <label>
            <input type="checkbox" id="closeShape" checked>
            Closed shape<br>
        </label>
        <label>
            <input type="checkbox" id="showCircle" checked>
            Show circle<br>
        </label>
        <button id="generateBtn">Generate</button><br>
        <button id="randomBtn">Random</button><br><br><br>
        <button id="downloadBtn">Download PNG</button><br>

        </div>
        
        <canvas id="sigilCanvas" width="500" height="500"></canvas>

        <h2>recent history</h2>
    </div>
<script src="script.js"></script>

</body>
</html>
